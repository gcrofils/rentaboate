<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Lisbon, this summer — a place to stay</title>
  <meta name="description" content="Bright, lived-in flat in Santos. Available 2 July to 13 August. Friends and friends of friends.">

  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=6">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=6">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=6">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=6">
  <link rel="manifest" href="/site.webmanifest?v=6">
  <meta name="theme-color" content="#f3eee8">
  <link rel="stylesheet" href="/style.css?v=6">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="A place to stay in Lisbon — this summer">
  <meta property="og:description" content="Bright, lived-in flat in Santos. Available 2 July to 13 August. Friends and friends of friends.">
  <meta property="og:url" content="https://lisbon.milizone.com/">
  <meta property="og:image" content="https://lisbon.milizone.com/assets/og-image.jpg?v=6">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Lisbon postcard — A place to stay in Lisbon">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="A place to stay in Lisbon — this summer">
  <meta name="twitter:description" content="Bright, lived-in flat in Santos. Available 2 July to 13 August. Friends and friends of friends.">
  <meta name="twitter:image" content="https://lisbon.milizone.com/assets/og-image.jpg?v=6">
  <meta name="twitter:image:alt" content="Lisbon postcard — A place to stay in Lisbon">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#f3eee8',
          },
        },
      },
    };
  </script>
</head>
<body class="bg-paper min-h-[100dvh]">
  <main class="min-h-[100dvh] grid place-items-center px-4 py-8">
    <div class="flex flex-col items-center gap-6">
      <button
        id="card"
        type="button"
        aria-pressed="false"
        aria-label="Show back of postcard"
        class="card group block focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-blue-700"
      >
        <div class="card-inner relative w-full h-full">
          <picture>
            <source media="(orientation: portrait)" srcset="/assets/postcard-front-portrait.jpg?v=6">
            <img
              class="card-face card-face--front absolute inset-0 w-full h-full rounded-lg"
              src="/assets/postcard-front.jpg?v=6"
              alt='Postcard front — collage of Lisbon scenes with the title "A place to stay in Lisbon, this summer."'
            >
          </picture>
          <picture>
            <source media="(orientation: portrait)" srcset="/assets/postcard-back-portrait.jpg?v=6">
            <img
              id="back-en"
              class="card-face card-face--back absolute inset-0 w-full h-full rounded-lg"
              src="/assets/postcard-back.jpg?v=6"
              alt="Postcard back (English) — welcome guide with check-in details, WiFi, and local recommendations."
            >
          </picture>
          <picture>
            <source media="(orientation: portrait)" srcset="/assets/postcard-back-fr-portrait.jpg?v=6">
            <img
              id="back-fr"
              class="card-face card-face--back absolute inset-0 w-full h-full rounded-lg"
              src="/assets/postcard-back-fr.jpg?v=6"
              alt="Verso de la carte postale (français) — note manuscrite décrivant un appartement à Santos disponible du 2 juillet au 13 août, 2 chambres, 700 euros par semaine."
              hidden
            >
          </picture>
        </div>
      </button>
      <div class="flex items-center gap-3">
        <div role="group" aria-label="Postcard language" class="lang-toggle inline-flex rounded-full bg-white/70 backdrop-blur ring-1 ring-slate-300/60 shadow overflow-hidden">
          <button id="lang-en" type="button" aria-pressed="true" class="lang-btn px-3 py-1.5 text-xs font-medium text-slate-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-700">EN</button>
          <button id="lang-fr" type="button" aria-pressed="false" class="lang-btn px-3 py-1.5 text-xs font-medium text-slate-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-700">FR</button>
        </div>
        <button
          id="hint"
          type="button"
          hidden
          class="hint inline-flex items-center gap-2 rounded-full bg-white/70 backdrop-blur px-4 py-2 text-sm text-slate-700 shadow ring-1 ring-slate-300/60 hover:bg-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-blue-700"
        >
          <span aria-hidden="true">↻</span> Flip it
        </button>
      </div>
    </div>
  </main>
  <script>
    (() => {
      const card = document.getElementById('card');
      const hint = document.getElementById('hint');
      const backEn = document.getElementById('back-en');
      const backFr = document.getElementById('back-fr');
      const btnEn = document.getElementById('lang-en');
      const btnFr = document.getElementById('lang-fr');
      const langGroup = btnEn.parentElement;
      const IDLE_MS = 4000;
      const STORAGE_KEY = 'lisbon-postcard-lang';

      const stored = (() => {
        try { return localStorage.getItem(STORAGE_KEY); } catch { return null; }
      })();
      const initial = stored === 'fr' || stored === 'en'
        ? stored
        : ((navigator.language || 'en').toLowerCase().startsWith('fr') ? 'fr' : 'en');
      applyLang(initial);

      function applyLang(lang) {
        const isFr = lang === 'fr';
        backEn.hidden = isFr;
        backFr.hidden = !isFr;
        btnEn.setAttribute('aria-pressed', isFr ? 'false' : 'true');
        btnFr.setAttribute('aria-pressed', isFr ? 'true' : 'false');
        btnEn.classList.toggle('is-active', !isFr);
        btnFr.classList.toggle('is-active', isFr);
        document.documentElement.lang = isFr ? 'fr' : 'en';
      }

      function setLang(lang, persist) {
        applyLang(lang);
        if (persist) {
          try { localStorage.setItem(STORAGE_KEY, lang); } catch {}
        }
      }

      let hasInteracted = false;
      let idleTimer = window.setTimeout(showHint, IDLE_MS);

      function flip() {
        const flipped = card.classList.toggle('is-flipped');
        card.setAttribute('aria-pressed', flipped ? 'true' : 'false');
        card.setAttribute(
          'aria-label',
          flipped ? 'Show front of postcard' : 'Show back of postcard'
        );
      }

      function markInteracted() {
        if (hasInteracted) return;
        hasInteracted = true;
        window.clearTimeout(idleTimer);
        hideHint();
      }

      function showHint() {
        if (hasInteracted) return;
        hint.hidden = false;
        requestAnimationFrame(() => hint.classList.add('is-visible'));
      }

      function hideHint() {
        hint.classList.remove('is-visible');
        hint.hidden = true;
      }

      card.addEventListener('click', () => {
        markInteracted();
        flip();
      });

      hint.addEventListener('click', () => {
        markInteracted();
        flip();
      });

      btnEn.addEventListener('click', () => {
        markInteracted();
        setLang('en', true);
      });

      btnFr.addEventListener('click', () => {
        markInteracted();
        setLang('fr', true);
      });

      ['keydown', 'pointerdown', 'touchstart'].forEach((evt) => {
        document.addEventListener(evt, (e) => {
          if (card.contains(e.target) || hint.contains(e.target) || langGroup.contains(e.target)) {
            return;
          }
          markInteracted();
        }, { passive: true });
      });
    })();
  </script>
</body>
</html>
