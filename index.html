<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Lisbon, this summer — a place to stay</title>
  <meta name="description" content="Bright, lived-in flat in Santos. Available 2 July to 13 August. Friends and friends of friends.">

  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=9">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=9">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=9">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=9">
  <link rel="manifest" href="/site.webmanifest?v=9">
  <meta name="theme-color" content="#f3eee8">
  <link rel="stylesheet" href="/style.css?v=9">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="A place to stay in Lisbon — this summer">
  <meta property="og:description" content="Bright, lived-in flat in Santos. Available 2 July to 13 August. Friends and friends of friends.">
  <meta property="og:url" content="https://lisbon.milizone.com/">
  <meta property="og:image" content="https://lisbon.milizone.com/assets/og-image.jpg?v=9">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Lisbon postcard — A place to stay in Lisbon">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="A place to stay in Lisbon — this summer">
  <meta name="twitter:description" content="Bright, lived-in flat in Santos. Available 2 July to 13 August. Friends and friends of friends.">
  <meta name="twitter:image" content="https://lisbon.milizone.com/assets/og-image.jpg?v=9">
  <meta name="twitter:image:alt" content="Lisbon postcard — A place to stay in Lisbon">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#f3eee8',
          },
        },
      },
    };
  </script>
</head>
<body class="bg-paper min-h-[100dvh]">
  <main class="min-h-[100dvh] grid place-items-center px-4 py-8">
    <div class="flex flex-col items-center">
      <button
        id="card"
        type="button"
        aria-pressed="false"
        aria-label="Show back of postcard"
        class="card group block focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-blue-700"
      >
        <div class="card-inner relative w-full h-full">
          <picture>
            <source media="(orientation: portrait)" srcset="/assets/postcard-front-portrait.jpg?v=9">
            <img
              class="card-face card-face--front absolute inset-0 w-full h-full rounded-lg"
              src="/assets/postcard-front.jpg?v=9"
              alt='Postcard front — collage of Lisbon scenes with the title "A place to stay in Lisbon, this summer."'
            >
          </picture>
          <picture>
            <source media="(orientation: portrait)" srcset="/assets/postcard-back-portrait.jpg?v=9">
            <img
              id="back-en"
              class="card-face card-face--back absolute inset-0 w-full h-full rounded-lg"
              src="/assets/postcard-back.jpg?v=9"
              alt="Postcard back (English) — welcome guide with check-in details, WiFi, and local recommendations."
            >
          </picture>
          <picture>
            <source media="(orientation: portrait)" srcset="/assets/postcard-back-fr-portrait.jpg?v=9">
            <img
              id="back-fr"
              class="card-face card-face--back absolute inset-0 w-full h-full rounded-lg"
              src="/assets/postcard-back-fr.jpg?v=9"
              alt="Verso de la carte postale (français) — note manuscrite décrivant un appartement à Santos disponible du 2 juillet au 13 août, 2 chambres, 700 euros par semaine."
              hidden
            >
          </picture>
        </div>
      </button>
    </div>
  </main>
  <button
    id="hint"
    type="button"
    hidden
    class="hint fixed top-4 left-1/2 -translate-x-1/2 z-10 inline-flex items-center gap-2 rounded-full bg-white/80 backdrop-blur px-4 py-2 text-sm text-slate-700 shadow ring-1 ring-slate-300/60 hover:bg-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-blue-700"
  >
    <span aria-hidden="true">↻</span> Flip it
  </button>
  <button
    id="lang-switch"
    type="button"
    class="fixed bottom-4 right-4 w-12 h-12 inline-flex items-center justify-center rounded-full bg-white/80 backdrop-blur text-sm font-semibold text-slate-700 shadow ring-1 ring-slate-300/60 hover:bg-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-700"
    aria-label="Switch to French"
  >FR</button>
  <script>
    (() => {
      const card = document.getElementById('card');
      const hint = document.getElementById('hint');
      const backEn = document.getElementById('back-en');
      const backFr = document.getElementById('back-fr');
      const langSwitch = document.getElementById('lang-switch');
      const IDLE_MS = 4000;
      const STORAGE_KEY = 'lisbon-postcard-lang';

      const stored = (() => {
        try { return localStorage.getItem(STORAGE_KEY); } catch { return null; }
      })();
      const initial = stored === 'fr' || stored === 'en'
        ? stored
        : ((navigator.language || 'en').toLowerCase().startsWith('fr') ? 'fr' : 'en');
      applyLang(initial);

      function applyLang(lang) {
        const isFr = lang === 'fr';
        backEn.hidden = isFr;
        backFr.hidden = !isFr;
        langSwitch.textContent = isFr ? 'EN' : 'FR';
        langSwitch.setAttribute(
          'aria-label',
          isFr ? 'Switch to English' : 'Passer en français'
        );
        document.documentElement.lang = isFr ? 'fr' : 'en';
      }

      function setLang(lang, persist) {
        applyLang(lang);
        if (persist) {
          try { localStorage.setItem(STORAGE_KEY, lang); } catch {}
        }
      }

      let hasInteracted = false;
      let idleTimer = window.setTimeout(showHint, IDLE_MS);

      function flip() {
        const flipped = card.classList.toggle('is-flipped');
        card.setAttribute('aria-pressed', flipped ? 'true' : 'false');
        card.setAttribute(
          'aria-label',
          flipped ? 'Show front of postcard' : 'Show back of postcard'
        );
      }

      function markInteracted() {
        if (hasInteracted) return;
        hasInteracted = true;
        window.clearTimeout(idleTimer);
        hideHint();
      }

      function showHint() {
        if (hasInteracted) return;
        hint.hidden = false;
        requestAnimationFrame(() => hint.classList.add('is-visible'));
      }

      function hideHint() {
        hint.classList.remove('is-visible');
        hint.hidden = true;
      }

      card.addEventListener('click', () => {
        markInteracted();
        flip();
      });

      hint.addEventListener('click', () => {
        markInteracted();
        flip();
      });

      langSwitch.addEventListener('click', () => {
        markInteracted();
        const next = document.documentElement.lang === 'fr' ? 'en' : 'fr';
        setLang(next, true);
      });

      ['keydown', 'pointerdown', 'touchstart'].forEach((evt) => {
        document.addEventListener(evt, (e) => {
          if (card.contains(e.target) || hint.contains(e.target) || langSwitch.contains(e.target)) {
            return;
          }
          markInteracted();
        }, { passive: true });
      });
    })();
  </script>
</body>
</html>
