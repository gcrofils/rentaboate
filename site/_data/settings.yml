# Everything that changes between seasons lives here.
# Each text has an English (en), French (fr) and Russian (ru) version.

season:
  en: this winter
  fr: cet hiver
  ru: этой зимой

available:
  en: 21 December – 24 February
  fr: 21 décembre – 24 février
  ru: 21 декабря – 24 февраля

sleeps:
  en: "2 bedrooms: 1 double bed, 2 single beds"
  fr: "2 chambres : 1 lit double, 2 lits simples"
  ru: "2 спальни: 1 двуспальная кровать, 2 односпальные"

minimum_stay:
  en: 1 week
  fr: 1 semaine
  ru: 1 неделя

rent:
  en: 800 € / week
  fr: 800 € / semaine
  ru: 800 € в неделю

# The big photo at the top. Files go in site/assets/photos/.
# The link preview images are site/assets/og-en.jpg, og-fr.jpg, og-ru.jpg (1200×630).
hero:
  file: hero-tram.jpg
  alt:
    en: A yellow Lisbon tram
    fr: Un tram jaune de Lisbonne
    ru: Жёлтый лиссабонский трамвай

# Order here is the order on the page: the photos fill the first column
# top to bottom, then the next one.
# alt: describes the photo for screen readers, never shown.
# caption: optional, shown over the photo. Leave it out for a plain tile.
# paused: true hides a photo without removing it.
